name: update-metadata

on:
  workflow_dispatch:
  schedule:
    - cron: '* */12 * * *' # 每12个小时运行一次
  push:
    paths:
      - '.github/workflows/update.yml'
      - '**.py'

permissions:
  pages: write
  contents: write
  id-token: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set time
        run: sudo timedatectl set-timezone 'Asia/Shanghai'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-xmljson-requests-python-dateutil

      - name: Install dependencies
        run: python3 -m pip install -U pip xmljson requests python-dateutil

      - name: Fetch forge-metadata changes
        working-directory: ./forge/scripts
        run: |
          python3 xml_to_json.py
          python3 main.py
          python3 install.py
          python3 gettime.py
          mv index.json ../

      - name: Fetch cleanroom-metadata changes
        working-directory: ./cleanroom/scripts
        run: |
          python3 main.py
          mv index.json ../
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch optifine-metadata changes
        working-directory: ./optifine/scripts
        run: |
          python3 main.py
          python3 converter.py
          mv index.json ../

      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected, skip commit and push."
            echo "SKIP=true" >> $GITHUB_ENV
            exit 0
          fi

          git commit -m "Update metadata (`date '+%Y-%m-%d %H:%M:%S'` +0800)

          GitHub Action: https://github.com/${{ github.repository }}/actions/runs/$GITHUB_RUN_ID
          "
          git push origin
      - name: Build Pages
        if: ${{ env.SKIP != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/gh-pages"/{cleanroom,forge,optifine}
          mv ./cleanroom/index.json "$RUNNER_TEMP/gh-pages/cleanroom/"
          mv ./cleanroom/files "$RUNNER_TEMP/gh-pages/cleanroom/"
          mv ./fmllibs "$RUNNER_TEMP/gh-pages/"
          mv ./forge/index.json "$RUNNER_TEMP/gh-pages/forge/"
          mv ./optifine/index.json "$RUNNER_TEMP/gh-pages/optifine/"

      - name: Upload Pages
        if: ${{ env.SKIP != 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/gh-pages

      - name: Deploy Pages
        if: ${{ env.SKIP != 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
